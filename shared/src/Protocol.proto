syntax = "proto3";

message Vec3 {
  float x = 0;
  float y = 1;
  float z = 2;
}

message uVec3 {
  uint32 x = 0;
  uint32 y = 1;
  uint32 z = 2;
}

message OpBall {
  Vec3 position = 0;
  Vec3 impulse = 1;
}

message OpPeer {
  string id = 0;
  Vec3 position = 1;
  Vec3 direction = 2;
}

message OpUpdate {
  uVec3 position = 0;
  uint32 value = 1;
}

message Operation {
  oneof type {
    OpBall ball = 0;
    OpPeer peer = 1;
    OpUpdate update = 2;
  }
}

message World {
  uVec3 size = 0;
  bytes data = 1;
}
