name: ci

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

concurrency:
  group: 'ci'
  cancel-in-progress: false

jobs:
  client:
    env:
      SERVER: __SERVER__
    outputs:
      version: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: |
            client/pnpm-lock.yaml
            shared/pnpm-lock.yaml
      - name: Install
        run: |
          pnpm -C shared install
          pnpm -C client install
      - name: Build
        run: |
          pnpm -C shared build:protocol
          pnpm -C client build
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/client
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: client
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  server:
    outputs:
      version: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: |
            shared/pnpm-lock.yaml
            server/pnpm-lock.yaml
      - name: Install
        run: |
          pnpm -C shared install
          pnpm -C server install
      - name: Build
        run: |
          pnpm -C shared build:protocol
          pnpm -C server build
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/server
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    if: vars.DEPLOYMENT_URL
    environment: 
      name: production
      url: ${{ vars.DEPLOYMENT_URL }}
    needs: [client, server]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: curl -f -s "${{ secrets.DEPLOYER_URL }}&client=${{ needs.client.outputs.version }}&server=${{ needs.server.outputs.version }}"
